<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FoxiGrow Task #11630 — Story Banner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .banner {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(180deg, #0a0a0a 0%, #121212 40%, #0a0a0a 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 80px 64px;
    }
    .accent-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 10px;
      background: linear-gradient(90deg, #ff6b00, #ff9500, #ff6b00);
    }
    .glow-top {
      position: absolute;
      width: 800px; height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,107,0,0.2) 0%, transparent 65%);
      top: 200px;
      left: 50%;
      transform: translateX(-50%);
    }
    .logo {
      font-size: 32px;
      font-weight: 700;
      color: #666;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-top: 40px;
      position: relative;
      z-index: 1;
    }
    .task-badge {
      margin-top: 120px;
      background: rgba(138, 43, 226, 0.2);
      border: 1px solid rgba(138, 43, 226, 0.5);
      color: #b57edc;
      font-size: 26px;
      font-weight: 600;
      padding: 14px 32px;
      border-radius: 999px;
      position: relative;
      z-index: 1;
    }
    .amount {
      margin-top: 60px;
      font-size: 180px;
      font-weight: 900;
      color: #ff6b00;
      line-height: 1;
      letter-spacing: -6px;
      position: relative;
      z-index: 1;
      text-shadow: 0 0 80px rgba(255,107,0,0.4);
    }
    .currency {
      font-size: 64px;
      font-weight: 700;
      color: #fff;
      margin-top: 8px;
      position: relative;
      z-index: 1;
    }
    .split {
      margin-top: 48px;
      font-size: 36px;
      color: #999;
      position: relative;
      z-index: 1;
    }
    .steps {
      margin-top: 80px;
      width: 100%;
      position: relative;
      z-index: 1;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 24px;
      background: rgba(255,255,255,0.04);
      border-left: 4px solid #ff6b00;
      padding: 28px 32px;
      margin-bottom: 16px;
      border-radius: 0 12px 12px 0;
      font-size: 30px;
      color: #ccc;
    }
    .step strong { color: #fff; }
    .rewards-row {
      display: flex;
      gap: 20px;
      margin-top: 60px;
      position: relative;
      z-index: 1;
    }
    .reward-box {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border-radius: 20px;
      padding: 32px;
      text-align: center;
    }
    .reward-box .val {
      font-size: 44px;
      font-weight: 800;
      color: #fff;
    }
    .reward-box .lbl {
      font-size: 22px;
      color: #888;
      margin-top: 8px;
    }
    .cta {
      margin-top: auto;
      width: 100%;
      background: linear-gradient(135deg, #ff6b00, #ff9500);
      color: #fff;
      font-size: 36px;
      font-weight: 800;
      padding: 36px;
      border-radius: 20px;
      text-align: center;
      position: relative;
      z-index: 1;
      letter-spacing: 1px;
    }
    .arrow {
      display: block;
      margin-top: 24px;
      font-size: 48px;
      color: #ff6b00;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .count {
      margin-top: 32px;
      font-size: 28px;
      color: #666;
      position: relative;
      z-index: 1;
    }
    .count span { color: #ff6b00; font-weight: 700; }
  </style>
</head>
<body>
  <div class="banner">
    <div class="accent-bar"></div>
    <div class="glow-top"></div>

    <div class="logo">FoxiGrow</div>
    <div class="task-badge">📋 Task #11630</div>

    <div class="amount">$20</div>
    <div class="currency">USDT REWARD</div>
    <div class="split">$11 + $9 split payout</div>

    <div class="steps">
      <div class="step"><strong>Deposit</strong> on HashKey MENA</div>
      <div class="step"><strong>Trade</strong> $3,000 volume</div>
      <div class="step"><strong>Submit</strong> screenshots → get paid</div>
    </div>

    <div class="rewards-row">
      <div class="reward-box">
        <div class="val">+11</div>
        <div class="lbl">USDT</div>
      </div>
      <div class="reward-box">
        <div class="val">+110</div>
        <div class="lbl">FG</div>
      </div>
    </div>

    <div class="cta">SWIPE UP · FOXIGROW</div>
    <div class="arrow">↑</div>
    <div class="count"><span>370+</span> already earning</div>
  </div>
</body>
</html>
