<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FoxiGrow Task #11630 — Square Banner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .banner {
      width: 1080px;
      height: 1080px;
      background: linear-gradient(165deg, #0a0a0a 0%, #141414 50%, #0d0d0d 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 64px;
    }
    .accent-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 8px;
      background: linear-gradient(90deg, #ff6b00, #ff9500, #ff6b00);
    }
    .glow {
      position: absolute;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,107,0,0.15) 0%, transparent 70%);
      top: -100px; right: -150px;
    }
    .top { position: relative; z-index: 1; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,107,0,0.15);
      border: 1px solid rgba(255,107,0,0.4);
      border-radius: 999px;
      padding: 12px 24px;
      color: #ff9500;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .badge-dot {
      width: 10px; height: 10px;
      background: #ff6b00;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .headline {
      margin-top: 48px;
      font-size: 96px;
      font-weight: 800;
      color: #fff;
      line-height: 1.05;
      letter-spacing: -2px;
    }
    .headline span { color: #ff6b00; }
    .sub {
      margin-top: 24px;
      font-size: 32px;
      color: #aaa;
      line-height: 1.4;
    }
    .rewards {
      display: flex;
      gap: 24px;
      margin-top: 40px;
    }
    .reward-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 16px 28px;
      font-size: 28px;
      font-weight: 700;
      color: #fff;
    }
    .usdt-icon {
      width: 36px; height: 36px;
      background: #26a17b;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      color: #fff;
    }
    .fg-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #ffd700, #ff9500);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: #000;
    }
    .bottom {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .cta {
      background: linear-gradient(135deg, #ff6b00, #ff9500);
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      padding: 24px 48px;
      border-radius: 16px;
      letter-spacing: 0.5px;
    }
    .social-proof {
      text-align: right;
    }
    .social-proof .num {
      font-size: 56px;
      font-weight: 800;
      color: #ff6b00;
    }
    .social-proof .label {
      font-size: 22px;
      color: #888;
      margin-top: 4px;
    }
    .brand {
      position: absolute;
      bottom: 64px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 26px;
      font-weight: 600;
      color: #555;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="accent-bar"></div>
    <div class="glow"></div>

    <div class="top">
      <div class="badge"><span class="badge-dot"></span> TASK #11630 · LIVE</div>
      <h1 class="headline">EARN<br><span>$20 USDT</span></h1>
      <p class="sub">$11 + $9 split reward · HashKey trading task</p>
      <div class="rewards">
        <div class="reward-pill"><span class="usdt-icon">₮</span> +11 USDT</div>
        <div class="reward-pill"><span class="fg-icon">FG</span> +110 FG</div>
      </div>
    </div>

    <div class="bottom">
      <div class="cta">OPEN FOXIGROW →</div>
      <div class="social-proof">
        <div class="num">370+</div>
        <div class="label">already earning</div>
      </div>
    </div>

    <div class="brand">FoxiGrow</div>
  </div>
</body>
</html>
