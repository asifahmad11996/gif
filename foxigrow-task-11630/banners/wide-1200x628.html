<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FoxiGrow Task #11630 — Wide Banner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .banner {
      width: 1200px;
      height: 628px;
      background: linear-gradient(135deg, #0a0a0a 0%, #161616 60%, #0d0d0d 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 0 72px;
    }
    .accent-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, #ff6b00, #ff9500, #ff6b00);
    }
    .glow {
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,107,0,0.12) 0%, transparent 70%);
      right: 80px;
      top: 50%;
      transform: translateY(-50%);
    }
    .left { flex: 1; position: relative; z-index: 1; }
    .badge {
      display: inline-block;
      background: rgba(255,107,0,0.15);
      border: 1px solid rgba(255,107,0,0.35);
      color: #ff9500;
      font-size: 16px;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    .headline {
      font-size: 72px;
      font-weight: 800;
      color: #fff;
      line-height: 1.05;
      letter-spacing: -1px;
    }
    .headline em {
      font-style: normal;
      color: #ff6b00;
    }
    .desc {
      margin-top: 16px;
      font-size: 22px;
      color: #999;
      max-width: 520px;
      line-height: 1.5;
    }
    .right {
      position: relative;
      z-index: 1;
      text-align: center;
    }
    .big-num {
      font-size: 120px;
      font-weight: 900;
      color: #ff6b00;
      line-height: 1;
      text-shadow: 0 0 60px rgba(255,107,0,0.35);
    }
    .big-label {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      margin-top: 4px;
    }
    .pills {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 24px;
    }
    .pill {
      background: rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 10px 20px;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }
    .pill.usdt { border-bottom: 3px solid #26a17b; }
    .pill.fg { border-bottom: 3px solid #ffd700; }
    .brand {
      position: absolute;
      bottom: 28px;
      right: 72px;
      font-size: 18px;
      font-weight: 600;
      color: #444;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .social {
      position: absolute;
      bottom: 28px;
      left: 72px;
      font-size: 18px;
      color: #666;
    }
    .social strong { color: #ff6b00; }
  </style>
</head>
<body>
  <div class="banner">
    <div class="accent-bar"></div>
    <div class="glow"></div>

    <div class="left">
      <div class="badge">TASK #11630 · HASHKEY MENA</div>
      <h1 class="headline">EARN <em>$20 USDT</em><br>ON FOXIGROW</h1>
      <p class="desc">Deposit + $3K trading volume. Reward split: $11 from platform + $9 bonus after Step 4.</p>
    </div>

    <div class="right">
      <div class="big-num">$20</div>
      <div class="big-label">TOTAL REWARD</div>
      <div class="pills">
        <div class="pill usdt">+11 USDT</div>
        <div class="pill fg">+110 FG</div>
      </div>
    </div>

    <div class="social"><strong>370+</strong> already earning</div>
    <div class="brand">FoxiGrow</div>
  </div>
</body>
</html>
