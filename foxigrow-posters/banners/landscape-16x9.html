<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FoxiGrow — Landscape Poster 16:9</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .poster {
      width: 1920px;
      height: 1080px;
      background: radial-gradient(ellipse at 50% 45%, #1a0f00 0%, #0a0a0a 45%, #000 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,107,0,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,107,0,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    }
    .glow-ring {
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,107,0,0.35) 0%, rgba(255,149,0,0.12) 35%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -58%);
      animation: pulse 3s ease-in-out infinite;
    }
    .glow-ring2 {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,149,0,0.25) 0%, transparent 65%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -58%);
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: translate(-50%, -58%) scale(1); }
      50% { opacity: 0.7; transform: translate(-50%, -58%) scale(1.05); }
    }
    .coin {
      position: absolute;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffe566 0%, #f5a623 40%, #c8860a 100%);
      box-shadow:
        0 8px 32px rgba(245,166,35,0.5),
        inset 0 -4px 12px rgba(0,0,0,0.3),
        inset 0 4px 12px rgba(255,255,255,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
      z-index: 2;
    }
    .coin::before {
      content: '';
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.25);
    }
    .coin::after {
      content: '₮';
      position: relative;
      z-index: 1;
    }
    .c1 { top: 180px; left: 280px; transform: rotate(-15deg) scale(1.1); }
    .c2 { top: 120px; right: 320px; transform: rotate(20deg) scale(0.95); }
    .c3 { bottom: 320px; left: 200px; transform: rotate(10deg) scale(0.85); }
    .c4 { bottom: 280px; right: 240px; transform: rotate(-25deg) scale(1.15); }
    .c5 { top: 420px; left: 120px; transform: rotate(30deg) scale(0.75); opacity: 0.85; }
    .c6 { top: 380px; right: 140px; transform: rotate(-10deg) scale(0.8); opacity: 0.85; }
    .logo-wrap {
      position: relative;
      z-index: 3;
      margin-bottom: 48px;
    }
    .logo-glow {
      position: absolute;
      inset: -40px;
      background: radial-gradient(circle, rgba(255,107,0,0.5) 0%, transparent 70%);
      filter: blur(30px);
    }
    .logo {
      position: relative;
      height: 220px;
      filter: drop-shadow(0 0 40px rgba(255,107,0,0.8)) drop-shadow(0 0 80px rgba(255,149,0,0.4));
    }
    .slogan {
      position: relative;
      z-index: 3;
      text-align: center;
      max-width: 1400px;
      padding: 0 80px;
    }
    .slogan h1 {
      font-size: 64px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -1px;
      line-height: 1.15;
    }
    .slogan h1 em {
      font-style: normal;
      color: #ff6b00;
    }
    .slogan p {
      margin-top: 20px;
      font-size: 28px;
      color: rgba(255,255,255,0.5);
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .accent-line {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, transparent, #ff6b00, #ff9500, #ff6b00, transparent);
    }
  </style>
</head>
<body>
  <div class="poster">
    <div class="grid"></div>
    <div class="glow-ring"></div>
    <div class="glow-ring2"></div>

    <div class="coin c1"></div>
    <div class="coin c2"></div>
    <div class="coin c3"></div>
    <div class="coin c4"></div>
    <div class="coin c5"></div>
    <div class="coin c6"></div>

    <div class="logo-wrap">
      <div class="logo-glow"></div>
      <img class="logo" src="../assets/foxigrow-logo.png" alt="FoxiGrow">
    </div>

    <div class="slogan">
      <h1><em>FoxiGrow</em> is Live — Complete Tasks, Earn USDT</h1>
      <p>Start earning today</p>
    </div>

    <div class="accent-line"></div>
  </div>
</body>
</html>
