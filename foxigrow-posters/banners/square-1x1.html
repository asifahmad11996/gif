<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FoxiGrow — Square Poster 1:1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .poster {
      width: 1080px;
      height: 1080px;
      background: linear-gradient(145deg, #0a1628 0%, #0d2847 35%, #1a3a6e 70%, #0f2240 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 48px;
    }
    .orb1 {
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59,130,246,0.2) 0%, transparent 70%);
      top: -120px; right: -100px;
    }
    .orb2 {
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%);
      bottom: -80px; left: -80px;
    }
    .header {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }
    .logo { height: 56px; }
    .live-badge {
      background: rgba(34,197,94,0.15);
      border: 1px solid rgba(34,197,94,0.4);
      color: #4ade80;
      font-size: 16px;
      font-weight: 700;
      padding: 10px 20px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .live-dot {
      width: 8px; height: 8px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 8px #4ade80;
    }
    .dashboard {
      position: relative;
      z-index: 1;
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 32px;
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .dash-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .balance-label {
      font-size: 16px;
      color: rgba(255,255,255,0.5);
      font-weight: 500;
    }
    .balance {
      font-size: 52px;
      font-weight: 800;
      color: #fff;
      margin-top: 6px;
      letter-spacing: -1px;
    }
    .balance span { color: #26a17b; font-size: 36px; }
    .wallet-chip {
      background: rgba(38,161,123,0.15);
      border: 1px solid rgba(38,161,123,0.3);
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 14px;
      color: #4ade80;
      font-weight: 600;
    }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .stat-card {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .stat-card .lbl {
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      font-weight: 500;
    }
    .stat-card .val {
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      margin-top: 8px;
    }
    .stat-card .val.green { color: #4ade80; }
    .tasks-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .section-title {
      font-size: 14px;
      color: rgba(255,255,255,0.4);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .task-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.04);
      border-radius: 14px;
      padding: 16px 20px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .task-info { display: flex; align-items: center; gap: 14px; }
    .task-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #ff6b00, #ff9500);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .task-name {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }
    .task-reward {
      font-size: 18px;
      font-weight: 800;
      color: #26a17b;
    }
    .badges {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 16px;
      margin-top: 28px;
    }
    .badge {
      flex: 1;
      text-align: center;
      padding: 20px 12px;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 800;
      color: #fff;
      border: 1px solid transparent;
    }
    .badge.cashout {
      background: linear-gradient(135deg, rgba(255,107,0,0.25), rgba(255,149,0,0.15));
      border-color: rgba(255,107,0,0.4);
    }
    .badge.fees {
      background: linear-gradient(135deg, rgba(59,130,246,0.25), rgba(99,102,241,0.15));
      border-color: rgba(59,130,246,0.4);
    }
    .badge.payout {
      background: linear-gradient(135deg, rgba(38,161,123,0.25), rgba(74,222,128,0.15));
      border-color: rgba(38,161,123,0.4);
    }
    .badge small {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.55);
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="poster">
    <div class="orb1"></div>
    <div class="orb2"></div>

    <div class="header">
      <img class="logo" src="../assets/foxigrow-logo.png" alt="FoxiGrow">
      <div class="live-badge"><span class="live-dot"></span> LIVE NOW</div>
    </div>

    <div class="dashboard">
      <div class="dash-top">
        <div>
          <div class="balance-label">Total Earnings</div>
          <div class="balance"><span>₮</span> 847.50 USDT</div>
        </div>
        <div class="wallet-chip">● Wallet Connected</div>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <div class="lbl">Tasks Done</div>
          <div class="val">124</div>
        </div>
        <div class="stat-card">
          <div class="lbl">This Week</div>
          <div class="val green">+₮42.80</div>
        </div>
        <div class="stat-card">
          <div class="lbl">FG Balance</div>
          <div class="val">2,410</div>
        </div>
      </div>

      <div class="tasks-section">
        <div class="section-title">Available Tasks</div>
        <div class="task-row">
          <div class="task-info">
            <div class="task-icon">📋</div>
            <div class="task-name">Social Media Task</div>
          </div>
          <div class="task-reward">+₮5.00</div>
        </div>
        <div class="task-row">
          <div class="task-info">
            <div class="task-icon">🔗</div>
            <div class="task-name">Platform Verification</div>
          </div>
          <div class="task-reward">+₮12.00</div>
        </div>
        <div class="task-row">
          <div class="task-info">
            <div class="task-icon">⭐</div>
            <div class="task-name">Premium Offer</div>
          </div>
          <div class="task-reward">+₮20.00</div>
        </div>
      </div>
    </div>

    <div class="badges">
      <div class="badge cashout">$2 Low Cashout<small>Minimum withdrawal</small></div>
      <div class="badge fees">Zero Fees<small>No hidden charges</small></div>
      <div class="badge payout">Instant USDT Payouts<small>Fast & secure</small></div>
    </div>
  </div>
</body>
</html>
