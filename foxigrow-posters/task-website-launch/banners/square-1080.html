<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FoxiGrow Task Website Launch — Square</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .poster {
      width: 1080px;
      height: 1080px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255,107,0,0.14) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 90%, rgba(59,130,246,0.08) 0%, transparent 45%),
        linear-gradient(165deg, #060608 0%, #0c0c10 40%, #08080c 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 64px 52px;
    }
    .accent-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, transparent, #ff6b00, #ff9500, #ff6b00, transparent);
    }
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at 50% 40%, black 20%, transparent 75%);
    }
    .orb {
      position: absolute;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,107,0,0.1) 0%, transparent 65%);
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
    }
    .logo-wrap {
      position: relative;
      z-index: 2;
      margin-top: 12px;
      margin-bottom: 36px;
    }
    .logo {
      height: 120px;
      width: auto;
      display: block;
    }
    .live-pill {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,107,0,0.12);
      border: 1px solid rgba(255,107,0,0.35);
      border-radius: 999px;
      padding: 10px 24px;
      margin-bottom: 28px;
    }
    .live-dot {
      width: 10px; height: 10px;
      background: #ff6b00;
      border-radius: 50%;
      box-shadow: 0 0 12px #ff6b00;
    }
    .live-pill span {
      font-size: 15px;
      font-weight: 700;
      color: #ff9500;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .headline {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 920px;
    }
    .headline h1 {
      font-size: 52px;
      font-weight: 900;
      color: #fff;
      line-height: 1.12;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }
    .headline h1 .accent { color: #ff6b00; }
    .sub {
      margin-top: 18px;
      font-size: 30px;
      font-weight: 600;
      color: rgba(255,255,255,0.72);
      letter-spacing: 0.3px;
    }
    .divider {
      position: relative;
      z-index: 2;
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #ff6b00, transparent);
      margin: 36px 0 32px;
    }
    .highlights {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }
    .highlight {
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 18px;
      padding: 22px 28px;
      backdrop-filter: blur(12px);
    }
    .highlight .icon {
      font-size: 32px;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,107,0,0.1);
      border-radius: 14px;
      flex-shrink: 0;
    }
    .highlight .text {
      font-size: 24px;
      font-weight: 600;
      color: #eee;
      line-height: 1.3;
    }
    .footer {
      position: relative;
      z-index: 2;
      margin-top: 28px;
      width: 100%;
      text-align: center;
    }
    .cta {
      display: inline-block;
      background: linear-gradient(135deg, #ff6b00, #ff9500);
      color: #fff;
      font-size: 22px;
      font-weight: 800;
      padding: 18px 48px;
      border-radius: 14px;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 32px rgba(255,107,0,0.35);
    }
    .accent-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, transparent, rgba(255,107,0,0.6), transparent);
    }
  </style>
</head>
<body>
  <div class="poster">
    <div class="accent-top"></div>
    <div class="grid"></div>
    <div class="orb"></div>

    <div class="logo-wrap">
      <img class="logo" src="../assets/foxigrow-logo.png" alt="FoxiGrow">
    </div>

    <div class="live-pill"><span class="live-dot"></span><span>Now Live</span></div>

    <div class="headline">
      <h1><span class="accent">FoxiGrow</span> Task Website<br>Is Live!</h1>
      <p class="sub">Complete Tasks. Earn Real Rewards.</p>
    </div>

    <div class="divider"></div>

    <div class="highlights">
      <div class="highlight">
        <div class="icon">🦊</div>
        <div class="text">Complete social &amp; micro tasks</div>
      </div>
      <div class="highlight">
        <div class="icon">💰</div>
        <div class="text">Earn USDT + FG Coin</div>
      </div>
      <div class="highlight">
        <div class="icon">🌍</div>
        <div class="text">Join from anywhere in the world</div>
      </div>
    </div>

    <div class="footer">
      <div class="cta">Start Earning Today →</div>
    </div>

    <div class="accent-bottom"></div>
  </div>
</body>
</html>
